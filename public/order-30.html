<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alleanza base — 30€</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 24px 80px;
    }
    .wrap { width: 100%; max-width: 480px; }
    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #1f22f2;
      margin-bottom: 24px;
    }
    .title {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 400;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.15;
    }
    .tagline {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.4);
      margin-bottom: 32px;
    }
    .price-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .price {
      font-family: 'Libre Baskerville', Georgia, serif;
      font-size: 3.5rem;
      color: #fff;
      line-height: 1;
    }
    .price-note {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
    }
    .features { list-style: none; margin-bottom: 40px; }
    .features li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.9rem;
      color: rgba(255,255,255,0.7);
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      line-height: 1.5;
    }
    .features li::before {
      content: '●';
      color: #1f22f2;
      font-size: 7px;
      margin-top: 5px;
      flex-shrink: 0;
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.06);
      margin-bottom: 32px;
    }
    .form-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">6 giugno 2025 · Torino · In presenza</p>
    <h1 class="title">Alleanza base</h1>
    <p class="tagline">Solo workshop</p>
    <div class="price-row">
      <span class="price">30€</span>
      <span class="price-note">pagamento unico</span>
    </div>
    <ul class="features">
      <li>Giornata completa di workshop in presenza</li>
      <li>Materiali di lavoro per costruire la tua offerta durante la giornata</li>
      <li>Accesso alla community dei partecipanti</li>
    </ul>
    <div class="divider"></div>
    <p class="form-label">Completa il tuo acquisto</p>

    <!-- ↓ INCOLLA QUI IL FORM DI SISTEME.IO ↓ -->

  </div>
</body>
</html>
